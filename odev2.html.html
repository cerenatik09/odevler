<!DOCTYPE html>
<html lang="tr" class="h-full select-none overflow-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kek Dilimi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@600;700&display=swap');

        html, body {
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
            width: 100%;
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Quicksand', sans-serif;
            background-color: #fce4ec;
        }

        body {
            background-image: radial-gradient(#f8bbd0 1.5px, transparent 1.5px);
            background-size: 20px 20px;
        }

        .font-fredoka {
            font-family: 'Fredoka One', cursive;
        }

        /* 9:16 Responsive Mobile Container */
        .mobile-container {
            width: 100vw;
            height: 100dvh;
            max-width: min(100vw, 480px);
            max-height: min(100dvh, 850px);
            box-shadow: 0 12px 35px rgba(186, 112, 137, 0.3);
            position: relative;
        }

        @media (min-height: 650px) and (min-width: 480px) {
            .mobile-container {
                height: calc(100dvh - 32px);
                aspect-ratio: 9 / 16;
                border-radius: 28px;
                border: 4px solid rgba(248, 187, 208, 0.9);
            }
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .btn-pastel-primary {
            background: linear-gradient(135deg, #ffb3ba 0%, #ffdfba 100%);
            color: #5d4037;
            box-shadow: 0 5px 0 #f0a3ab, 0 8px 15px rgba(0,0,0,0.1);
            transition: transform 0.08s ease, box-shadow 0.08s ease;
        }

        .btn-pastel-primary:active {
            transform: translateY(3px) scale(0.98);
            box-shadow: 0 2px 0 #f0a3ab, 0 3px 8px rgba(0,0,0,0.1);
        }

        .pulse-subtle {
            animation: pulseSubtle 1.8s infinite ease-in-out;
        }

        @keyframes pulseSubtle {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-full bg-pink-100 p-0 sm:p-2">

    <!-- 9:16 Game Screen Wrapper -->
    <div id="gameWrapper" class="mobile-container overflow-hidden bg-pink-50 flex flex-col justify-between">
        
        <!-- Main Game Canvas -->
        <canvas id="gameCanvas" class="absolute inset-0 z-0"></canvas>

        <div id="hud" class="relative z-10 w-full p-3 sm:p-4 flex justify-between items-start pointer-events-none hidden">
            <!-- Audio Toggle Button -->
            <button id="soundToggle" type="button" class="pointer-events-auto w-11 h-11 bg-white/95 backdrop-blur-md rounded-2xl border-2 border-pink-200 flex items-center justify-center text-pink-500 shadow-lg active:scale-90 transition-transform text-xl">
                🔊
            </button>

            <!-- Top Right Score & Record Panel -->
            <div class="flex flex-col items-end pointer-events-none">
                <div class="bg-white/95 backdrop-blur-md px-3.5 py-1.5 rounded-2xl border-2 border-pink-200 text-right shadow-lg">
                    <div class="text-[9px] font-bold text-pink-400 uppercase tracking-wider">SKOR</div>
                    <div id="scoreText" class="font-fredoka text-2xl sm:text-3xl text-amber-800 leading-none">0</div>
                    <div class="text-[9px] font-bold text-amber-600/90 mt-0.5">En Yüksek: <span id="highScoreHUDText">0</span></div>
                </div>
                <div id="perfectText" class="font-fredoka text-sm sm:text-base text-pink-500 mt-2 opacity-0 transition-all duration-300 transform translate-y-2 drop-shadow-sm bg-white/90 px-3 py-1 rounded-full border border-pink-200">✨ MÜKEMMEL!</div>
            </div>
        </div>

        <!-- Touch Instruction Hint for Mobile Users -->
        <div id="touchHint" class="relative z-10 text-center pb-5 pointer-events-none opacity-0 transition-opacity duration-500">
            <span class="bg-white/95 backdrop-blur-md px-4 py-2 rounded-full border border-pink-200 text-xs font-bold text-pink-500 shadow-md animate-pulse">
                👇 Kek Dilimini Düşürmek İçin Dokun!
            </span>
        </div>

        <div id="startScreen" class="absolute inset-0 bg-pink-100/95 backdrop-blur-md flex flex-col items-center justify-between p-6 z-30">
            <div class="w-full text-center mt-6">
                <div class="text-6xl sm:text-7xl mb-2 animate-bounce">🍰</div>
                <h1 class="font-fredoka text-4xl sm:text-5xl text-pink-600 drop-shadow-sm leading-tight">
                    KEK<br><span class="text-amber-700">DİLİMİ</span>
                </h1>
                <p class="text-amber-900/80 text-xs mt-3 font-bold bg-white/80 py-2 px-4 rounded-full inline-block border border-pink-200 shadow-sm">
                    ✨ Pasta Katlarını Mükemmel Diz! ✨
                </p>
            </div>

            <div class="bg-white/95 rounded-2xl p-4 w-full max-w-xs text-center border-2 border-pink-200 shadow-md">
                <div class="text-[10px] text-pink-400 font-bold uppercase tracking-wider">EN YÜKSEK REKOR</div>
                <div id="startHighScoreText" class="font-fredoka text-3xl sm:text-4xl text-amber-800 mt-0.5">0</div>
            </div>

            <div class="w-full max-w-xs space-y-3 mb-2">
                <button id="startBtn" type="button" class="btn-pastel-primary pulse-subtle w-full py-4 rounded-2xl font-fredoka text-2xl text-amber-900 tracking-wide uppercase">
                    Oyuna Başla 🍰
                </button>
                <p class="text-center text-[11px] text-pink-500 font-bold">Mobil dokunmatik ekranlara %100 uyumludur.</p>
            </div>
        </div>

        <div id="gameOverScreen" class="absolute inset-0 bg-amber-950/40 backdrop-blur-md flex flex-col items-center justify-center p-6 z-30 hidden">
            <div class="bg-white rounded-3xl p-6 w-full max-w-xs text-center border-4 border-pink-200 shadow-2xl">
                <div class="text-5xl mb-2">🧁</div>
                <h2 class="font-fredoka text-2xl text-pink-600">KEK DEVRİLDİ!</h2>
                <p class="text-amber-800/80 text-xs mt-1 font-semibold">Harika bir pastane kulesiydi!</p>

                <div class="my-4 space-y-2 bg-pink-50/90 p-3.5 rounded-2xl border border-pink-200">
                    <div>
                        <div class="text-[10px] font-bold text-pink-400 uppercase tracking-wider">YAPILAN KAT</div>
                        <div id="finalScoreText" class="font-fredoka text-3xl text-amber-800">0</div>
                    </div>
                    <div class="pt-2 border-t border-pink-200 flex justify-between items-center px-2">
                        <span class="text-xs text-amber-700 font-bold">En Yüksek Rekor:</span>
                        <span id="finalHighScoreText" class="font-fredoka text-base text-pink-600">0</span>
                    </div>
                </div>

                <button id="restartBtn" type="button" class="btn-pastel-primary w-full py-3.5 rounded-2xl font-fredoka text-xl text-amber-900 tracking-wide uppercase">
                    Tekrar Oyna 🔄
                </button>
            </div>
        </div>
    </div>

    <script>
        // Web Audio Synthesizer (Zero External Dependencies)
        class SoundEffects {
            constructor() {
                this.ctx = null;
                this.muted = false;
                this.unlocked = false;
            }

            unlock() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
                this.unlocked = true;
            }

            playTone(freq, type, duration, gainVal = 0.12) {
                if (this.muted || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }

            playDrop() { this.playTone(250, 'sine', 0.08, 0.15); }
            playSlice() { this.playTone(160, 'sawtooth', 0.12, 0.15); }

            playPerfect(combo) {
                if (this.muted || !this.ctx) return;
                const baseFreq = 520 + Math.min(combo * 65, 380);
                this.playTone(baseFreq, 'sine', 0.16, 0.2);
                setTimeout(() => this.playTone(baseFreq * 1.25, 'sine', 0.2, 0.2), 65);
            }

            playGameOver() {
                if (this.muted || !this.ctx) return;
                this.playTone(280, 'sawtooth', 0.18, 0.2);
                setTimeout(() => this.playTone(210, 'sawtooth', 0.18, 0.2), 130);
                setTimeout(() => this.playTone(140, 'sawtooth', 0.35, 0.25), 260);
            }
        }

        const sounds = new SoundEffects();

        // Mobile Safe Haptic Feedback
        function triggerHaptic(pattern = 25) {
            if ('vibrate' in navigator) {
                try { navigator.vibrate(pattern); } catch (e) {}
            }
        }

        // Pastel Bakery Palette
        const PASTEL_PALETTE = [
            { bg: '#FFB3BA', frosting: '#FFFFFF', detail: '#FF80AB', topping: '🍓' },
            { bg: '#BAFFC9', frosting: '#FFFFD8', detail: '#B5EAD7', topping: '🥝' },
            { bg: '#BAE1FF', frosting: '#FFFFFF', detail: '#90CAF9', topping: '🫐' },
            { bg: '#FFFFBA', frosting: '#5D4037', detail: '#FFE082', topping: '🍌' },
            { bg: '#E8AEFF', frosting: '#FFFFFF', detail: '#CE93D8', topping: '🍇' },
            { bg: '#FFDFBA', frosting: '#8D6E63', detail: '#FFCC80', topping: '🍒' }
        ];

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const wrapper = document.getElementById('gameWrapper');

        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const hud = document.getElementById('hud');
        const touchHint = document.getElementById('touchHint');
        const scoreText = document.getElementById('scoreText');
        const highScoreHUDText = document.getElementById('highScoreHUDText');
        const startHighScoreText = document.getElementById('startHighScoreText');
        const finalScoreText = document.getElementById('finalScoreText');
        const finalHighScoreText = document.getElementById('finalHighScoreText');
        const perfectText = document.getElementById('perfectText');
        const soundToggle = document.getElementById('soundToggle');

        let canvasWidth = 360;
        let canvasHeight = 640;

        function resizeCanvas() {
            const rect = wrapper.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            
            canvasWidth = rect.width;
            canvasHeight = rect.height;

            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;

            ctx.scale(dpr, dpr);
        }

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 120));

        // State Machine Variables
        let gameState = 'START';
        let score = 0;
        let highScore = parseInt(localStorage.getItem('kek_dilimi_high_score') || '0');
        let combo = 0;
        let cameraY = 0;
        let targetCameraY = 0;

        const CAKE_HEIGHT = 36;
        const GRAVITY = 0.65;

        let stack = [];
        let fallingBlock = null;
        let topSpawner = null;
        let debris = [];
        let particles = [];
        let lastInputTime = 0;

        function updateHighScoreDisplays() {
            highScoreHUDText.innerText = highScore;
            startHighScoreText.innerText = highScore;
            finalHighScoreText.innerText = highScore;
        }

        function resetGame() {
            score = 0;
            combo = 0;
            cameraY = 0;
            targetCameraY = 0;
            stack = [];
            debris = [];
            particles = [];
            fallingBlock = null;
            scoreText.innerText = '0';

            const baseWidth = Math.min(canvasWidth * 0.52, 180);
            const baseX = (canvasWidth - baseWidth) / 2;
            const baseY = canvasHeight - 110;

            // Ceramic Cake Stand Base
            stack.push({
                x: baseX,
                y: baseY,
                width: baseWidth,
                colorIndex: 0,
                isBase: true
            });

            spawnSpawner();

            touchHint.classList.remove('opacity-0');
            setTimeout(() => touchHint.classList.add('opacity-0'), 2500);
        }

        function spawnSpawner() {
            const topBlock = stack[stack.length - 1];
            const colorIndex = stack.length % PASTEL_PALETTE.length;
            const moveSpeed = 2.4 + Math.min(score * 0.12, 6.2);

            topSpawner = {
                x: (canvasWidth - topBlock.width) / 2,
                y: 80 - cameraY,
                width: topBlock.width,
                colorIndex: colorIndex,
                speed: moveSpeed,
                dir: 1
            };
        }

        function dropCurrentCake() {
            if (gameState !== 'PLAYING' || !topSpawner || fallingBlock) return;

            sounds.unlock();
            sounds.playDrop();
            triggerHaptic(20);

            fallingBlock = {
                x: topSpawner.x,
                y: topSpawner.y,
                width: topSpawner.width,
                colorIndex: topSpawner.colorIndex,
                vy: 2
            };

            topSpawner = null;
        }

        function handleLanding() {
            const topBlock = stack[stack.length - 1];
            const landingY = topBlock.y - CAKE_HEIGHT;

            fallingBlock.y = landingY;
            const deltaX = fallingBlock.x - topBlock.x;
            const overhang = Math.abs(deltaX);

            // PERFECT DROP (within 5px threshold)
            if (overhang <= 5) {
                fallingBlock.x = topBlock.x;
                combo++;
                score++;
                
                sounds.playPerfect(combo);
                triggerHaptic([30, 20, 60]);
                triggerPerfectFX(fallingBlock.x + fallingBlock.width / 2, fallingBlock.y);

                if (combo >= 3) {
                    fallingBlock.width = Math.min(fallingBlock.width + 12, canvasWidth * 0.65);
                }

                stack.push(fallingBlock);
            } else if (overhang >= fallingBlock.width) {
                // COMPLETE MISS GAME OVER
                sounds.playGameOver();
                triggerHaptic([60, 50, 100]);

                debris.push({
                    x: fallingBlock.x,
                    y: fallingBlock.y,
                    width: fallingBlock.width,
                    vx: (fallingBlock.x > topBlock.x ? 2.8 : -2.8),
                    vy: 1,
                    colorIndex: fallingBlock.colorIndex,
                    rot: 0
                });

                fallingBlock = null;
                endGame();
                return;
            } else {
                // SLICE CUT OVERHANG
                combo = 0;
                score++;
                sounds.playSlice();
                triggerHaptic(25);

                const newWidth = fallingBlock.width - overhang;
                let cutX, cutWidth;

                if (deltaX > 0) {
                    cutX = topBlock.x + newWidth;
                    cutWidth = overhang;
                    fallingBlock.width = newWidth;
                } else {
                    cutX = fallingBlock.x;
                    cutWidth = overhang;
                    fallingBlock.x = topBlock.x;
                    fallingBlock.width = newWidth;
                }

                debris.push({
                    x: cutX,
                    y: fallingBlock.y,
                    width: cutWidth,
                    vx: deltaX > 0 ? 3 : -3,
                    vy: -1,
                    colorIndex: fallingBlock.colorIndex,
                    rot: 0
                });

                createSliceParticles(cutX + cutWidth / 2, fallingBlock.y + CAKE_HEIGHT / 2);
                stack.push(fallingBlock);
            }

            scoreText.innerText = score;

            if (stack.length > 5) {
                targetCameraY = (stack.length - 5) * CAKE_HEIGHT;
            }

            fallingBlock = null;
            spawnSpawner();
        }

        function triggerPerfectFX(x, y) {
            perfectText.classList.remove('opacity-0', 'translate-y-2');
            perfectText.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                perfectText.classList.remove('opacity-100', 'translate-y-0');
                perfectText.classList.add('opacity-0', 'translate-y-2');
            }, 650);

            for (let i = 0; i < 16; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 7,
                    vy: (Math.random() - 0.5) * 7 - 2,
                    radius: Math.random() * 4 + 2,
                    color: ['#FF80AB', '#FFEB3B', '#B5EAD7', '#FFF'][Math.floor(Math.random() * 4)],
                    life: 1
                });
            }
        }

        function createSliceParticles(x, y) {
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 5,
                    vy: (Math.random() - 1) * 4,
                    radius: Math.random() * 3 + 1.5,
                    color: '#f0a3ab',
                    life: 1
                });
            }
        }

        function endGame() {
            gameState = 'GAMEOVER';
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('kek_dilimi_high_score', highScore.toString());
            }

            updateHighScoreDisplays();
            finalScoreText.innerText = score;

            setTimeout(() => {
                hud.classList.add('hidden');
                gameOverScreen.classList.remove('hidden');
            }, 550);
        }

        function drawBakeryBackground() {
            const wallGrad = ctx.createLinearGradient(0, 0, 0, canvasHeight);
            wallGrad.addColorStop(0, '#FFF0F5');
            wallGrad.addColorStop(0.5, '#FFE4E8');
            wallGrad.addColorStop(1, '#F8CECC');
            ctx.fillStyle = wallGrad;
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);

            // Pastel Wall Stripes
            ctx.fillStyle = 'rgba(255, 255, 255, 0.42)';
            const stripeWidth = 24;
            for (let x = 0; x < canvasWidth; x += stripeWidth * 2) {
                ctx.fillRect(x, 0, stripeWidth, canvasHeight);
            }

            // Subtle Sparkles
            ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
            const sparkles = [
                { x: canvasWidth * 0.15, y: 120, r: 3 },
                { x: canvasWidth * 0.85, y: 180, r: 4 },
                { x: canvasWidth * 0.22, y: 260, r: 2.5 },
                { x: canvasWidth * 0.8, y: 340, r: 3.5 },
                { x: canvasWidth * 0.18, y: 440, r: 3 }
            ];
            sparkles.forEach(s => {
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fill();
            });

            // Bottom Counter Base
            const counterY = canvasHeight - 75;
            ctx.fillStyle = '#FCE1E4';
            ctx.fillRect(0, counterY, canvasWidth, 75);
            ctx.fillStyle = '#E8AEB7';
            ctx.fillRect(0, counterY, canvasWidth, 12);

            // Top Awning Striped Canopy
            const awningHeight = 34;
            const tentStripe = 22;
            for (let i = 0; i < canvasWidth + tentStripe; i += tentStripe) {
                ctx.fillStyle = (Math.floor(i / tentStripe)) % 2 === 0 ? '#FFB3BA' : '#FFFFFF';
                ctx.beginPath();
                ctx.roundRect(i, 0, tentStripe, awningHeight, [0, 0, 8, 8]);
                ctx.fill();
            }

            ctx.fillStyle = 'rgba(216, 112, 147, 0.12)';
            ctx.fillRect(0, awningHeight, canvasWidth, 5);
        }

        function drawCakeBlock(block) {
            const palette = PASTEL_PALETTE[block.colorIndex % PASTEL_PALETTE.length];
            const renderY = block.y + cameraY;

            // Shadow
            ctx.fillStyle = 'rgba(93, 64, 55, 0.08)';
            ctx.beginPath();
            ctx.roundRect(block.x + 3, renderY + CAKE_HEIGHT - 2, block.width, 6, 3);
            ctx.fill();

            // Main Cake Body
            ctx.fillStyle = palette.bg;
            ctx.beginPath();
            ctx.roundRect(block.x, renderY, block.width, CAKE_HEIGHT, 10);
            ctx.fill();

            // Frosting Top
            ctx.fillStyle = palette.frosting;
            ctx.beginPath();
            ctx.roundRect(block.x - 2, renderY, block.width + 4, 11, [8, 8, 4, 4]);
            ctx.fill();

            // Frosting Drip Accents
            ctx.fillStyle = palette.frosting;
            const dripCount = Math.floor(block.width / 15);
            for (let i = 0; i < dripCount; i++) {
                const dx = block.x + 7 + i * 15;
                ctx.beginPath();
                ctx.arc(dx, renderY + 11, 3.2, 0, Math.PI);
                ctx.fill();
            }

            // Cake Center Stripe
            ctx.fillStyle = palette.detail;
            ctx.fillRect(block.x + 4, renderY + 19, block.width - 8, 4);

            // Topping Fruit Emoji
            if (block.width >= 30) {
                ctx.font = '13px sans-serif';
                ctx.fillText(palette.topping, block.x + block.width / 2 - 6, renderY + 3);
            }
        }

        function drawBaseTable(base) {
            const renderY = base.y + cameraY;

            // Base Shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.06)';
            ctx.beginPath();
            ctx.ellipse(canvasWidth / 2, renderY + 45, base.width * 0.75, 10, 0, 0, Math.PI * 2);
            ctx.fill();

            // Ceramic Stand Top
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.roundRect(base.x - 16, renderY, base.width + 32, 20, 10);
            ctx.fill();
            ctx.fillStyle = '#FFCDD2';
            ctx.fillRect(base.x - 16, renderY + 14, base.width + 32, 6);

            // Stand Pillar
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(canvasWidth / 2 - 18, renderY + 20, 36, 60);
        }

        function update() {
            cameraY += (targetCameraY - cameraY) * 0.1;

            if (gameState === 'PLAYING' && topSpawner) {
                topSpawner.x += topSpawner.speed * topSpawner.dir;
                if (topSpawner.x + topSpawner.width >= canvasWidth - 10) {
                    topSpawner.dir = -1;
                } else if (topSpawner.x <= 10) {
                    topSpawner.dir = 1;
                }
            }

            if (fallingBlock) {
                fallingBlock.vy += GRAVITY;
                fallingBlock.y += fallingBlock.vy;

                const targetTopY = stack[stack.length - 1].y - CAKE_HEIGHT;
                if (fallingBlock.y >= targetTopY) {
                    handleLanding();
                }
            }

            for (let i = debris.length - 1; i >= 0; i--) {
                const d = debris[i];
                d.x += d.vx;
                d.y += d.vy;
                d.vy += GRAVITY * 0.8;
                d.rot += 0.06;

                if (d.y + cameraY > canvasHeight + 100) {
                    debris.splice(i, 1);
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.03;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function render() {
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);

            drawBakeryBackground();

            if (stack.length > 0) {
                drawBaseTable(stack[0]);
            }

            for (let i = 0; i < stack.length; i++) {
                drawCakeBlock(stack[i]);
            }

            if (topSpawner) {
                // Drop Alignment Guide
                ctx.strokeStyle = 'rgba(244, 143, 177, 0.35)';
                ctx.setLineDash([4, 6]);
                ctx.beginPath();
                ctx.moveTo(topSpawner.x + topSpawner.width / 2, topSpawner.y + CAKE_HEIGHT + cameraY);
                ctx.lineTo(topSpawner.x + topSpawner.width / 2, canvasHeight - 80);
                ctx.stroke();
                ctx.setLineDash([]);

                drawCakeBlock({
                    ...topSpawner,
                    y: topSpawner.y
                });
            }

            if (fallingBlock) {
                drawCakeBlock(fallingBlock);
            }

            debris.forEach(d => {
                ctx.save();
                const renderY = d.y + cameraY;
                ctx.translate(d.x + d.width / 2, renderY + CAKE_HEIGHT / 2);
                ctx.rotate(d.rot);
                drawCakeBlock({
                    x: -d.width / 2,
                    y: -CAKE_HEIGHT / 2,
                    width: d.width,
                    colorIndex: d.colorIndex
                });
                ctx.restore();
            });

            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y + cameraY, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            });
        }

        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            sounds.unlock();
            gameState = 'PLAYING';
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            hud.classList.remove('hidden');
            resetGame();
        }

        function handleInput(e) {
            sounds.unlock();

            // Ignore button presses from triggering a cake drop
            if (e.target && e.target.closest('#soundToggle, #startBtn, #restartBtn')) {
                return;
            }

            const now = Date.now();
            if (now - lastInputTime < 140) return; // Debounce rapid tap/clicks
            lastInputTime = now;

            if (gameState === 'PLAYING') {
                if (e.cancelable) e.preventDefault();
                dropCurrentCake();
            }
        }

        // Register Touch & Pointer Listeners
        window.addEventListener('pointerdown', handleInput, { passive: false });

        // Keyboard Backup Controls
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'Enter') {
                sounds.unlock();
                if (gameState === 'PLAYING') {
                    dropCurrentCake();
                } else if (gameState === 'START') {
                    startGame();
                }
            }
        });

        document.getElementById('startBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            startGame();
        });

        document.getElementById('restartBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            startGame();
        });

        soundToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            sounds.muted = !sounds.muted;
            soundToggle.innerText = sounds.muted ? '🔇' : '🔊';
        });

        window.onload = () => {
            resizeCanvas();
            updateHighScoreDisplays();
            gameLoop();
        };
    </script>
</body>
</html>
